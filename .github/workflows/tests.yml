name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --quiet fastapi httpx

      - name: Unit tests (core, art, API)
        working-directory: tests
        run: python -m unittest test_core test_api -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Desktop half parses
        run: node --check desktop/plugin.js

      - name: Display arithmetic (extracted from plugin.js)
        run: node --test tests/display.test.mjs

      - name: Mount-time guard (dead setters, unimported hooks, quoted areas)
        run: python scripts/check_setters.py desktop/plugin.js

      - name: Manifest sanity
        run: |
          python - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("dashboard/manifest.json").read_text())
          assert manifest["name"] == "wheelspin", manifest
          assert manifest["api"] == "plugin_api.py", manifest
          plugin = pathlib.Path("plugin.yaml").read_text()
          assert "provides_tools:" in plugin
          assert f'version: {manifest["version"]}' in plugin, "version drift between manifest and plugin.yaml"
          print("manifest ok:", manifest["version"])
          PY
